<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Itinéraire Vacances</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef5f0;
    padding: 16px;
    margin: 0;
  }

  h1 {
    text-align: center;
    color: #2e7d32;
  }

  .card {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin: 14px 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }

  input, textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    background: #4caf50;
    color: white;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
  }

  .btn-secondary { background: #607d8b; }
  .btn-danger { background: #ef5350; }

  .section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #eee;
  }

  .section-title {
    font-weight: bold;
    color: #2e7d32;
    margin-bottom: 4px;
  }

  .line { margin-bottom: 3px; }

  .totals {
    background: #e8f5e9;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="date" type="date">
    <input id="step" placeholder="Étape">
    <input id="km" placeholder="Kilomètres">
    <input id="duration" placeholder="Durée">
  </div>

  <div class="section">
    <div class="section-title">🚗 Déplacement</div>
    <input id="transport" placeholder="Transport">
    <input id="transportPrice" placeholder="Prix transport (€)">
  </div>

  <div class="section">
    <div class="section-title">🏨 Hébergement</div>
    <input id="hotel" placeholder="Nom">
    <input id="hotelAddress" placeholder="Adresse">
    <input id="hotelPrice" placeholder="Prix (€)">
  </div>

  <div class="section">
    <div class="section-title">📋 Infos</div>
    <textarea id="things" placeholder="À voir"></textarea>
    <textarea id="comments" placeholder="Commentaires"></textarea>
  </div>

  <button onclick="addStep()">Ajouter une étape</button>

</div>

<div class="card totals">
  <div>Km total : <span id="totalKm">0</span></div>
  <div>Budget total : <span id="totalPrice">0</span> €</div>
</div>

<div id="list"></div>

<script>
let steps = [];
let editingIndex = null;

function addStep() {

  const newStep = {
    date: document.getElementById("date").value,
    step: document.getElementById("step").value,
    km: parseFloat(document.getElementById("km").value) || 0,
    duration: document.getElementById("duration").value,
    transport: document.getElementById("transport").value,
    transportPrice: parseFloat(document.getElementById("transportPrice").value) || 0,
    hotel: document.getElementById("hotel").value,
    hotelAddress: document.getElementById("hotelAddress").value,
    hotelPrice: parseFloat(document.getElementById("hotelPrice").value) || 0,
    things: document.getElementById("things").value,
    comments: document.getElementById("comments").value
  };

  if (!newStep.step) {
    alert("Ajoute une étape 😄");
    return;
  }

  if (editingIndex !== null) {
    steps[editingIndex] = newStep;
    editingIndex = null;
  } else {
    steps.push(newStep);
  }

  render();

  // reset form
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
}

function editStep(i) {
  const s = steps[i];

  document.getElementById("date").value = s.date;
  document.getElementById("step").value = s.step;
  document.getElementById("km").value = s.km;
  document.getElementById("duration").value = s.duration;
  document.getElementById("transport").value = s.transport;
  document.getElementById("transportPrice").value = s.transportPrice;
  document.getElementById("hotel").value = s.hotel;
  document.getElementById("hotelAddress").value = s.hotelAddress;
  document.getElementById("hotelPrice").value = s.hotelPrice;
  document.getElementById("things").value = s.things;
  document.getElementById("comments").value = s.comments;

  editingIndex = i;
}

function deleteStep(i) {
  steps.splice(i, 1);
  render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let totalKm = 0;
  let totalPrice = 0;

  steps.forEach((s, i) => {

    totalKm += s.km;
    totalPrice += s.transportPrice + s.hotelPrice;

    list.innerHTML += `
      <div class="card">
        <strong>${s.date} — ${s.step}</strong>

        <div class="section">
          <div class="section-title">Étape</div>
          <div class="line">Km : ${s.km}</div>
          <div class="line">Durée : ${s.duration}</div>
        </div>

        <div class="section">
          <div class="section-title">Déplacement</div>
          <div class="line">Transport : ${s.transport}</div>
          <div class="line">Prix : ${s.transportPrice}</div>
        </div>

        <div class="section">
          <div class="section-title">Hébergement</div>
