<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #eef5f0;
      padding: 16px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid #d9e8dc;
      background: #f8fbf9;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #4caf50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #43a047;
    }

    .section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eef2ef;
    }

    .section-title {
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 6px;
    }

    .header {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .line {
      margin-bottom: 4px;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .btn-danger {
      background: #ef5350;
    }

    .totals {
      background: #e8f5e9;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<!-- FORMULAIRE -->
<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="date" type="date">
    <input id="step" placeholder="Étape">
    <input id="km" placeholder="Kilomètres">
    <input id="duration" placeholder="Durée">
  </div>

  <div class="section">
    <div class="section-title">🚗 Déplacement</div>
    <input id="transport" placeholder="Transport">
    <input id="transportPrice" placeholder="Prix transport">
  </div>

  <div class="section">
    <div class="section-title">🏨 Hébergement</div>
    <input id="hotel" placeholder="Nom hébergement">
    <input id="hotelAddress" placeholder="Adresse">
    <input id="hotelPrice" placeholder="Prix">
  </div>

  <div class="section">
    <div class="section-title">📋 Infos</div>
    <textarea id="things" placeholder="À voir"></textarea>
    <textarea id="comments" placeholder="Commentaires"></textarea>
  </div>

  <button onclick="addStep()">Ajouter une étape</button>

</div>

<!-- TOTAUX -->
<div class="card totals">
  📊 Total km : <span id="totalKm">0</span><br>
  💰 Budget total : <span id="totalPrice">0</span> €
</div>

<!-- LISTE -->
<div id="list"></div>

<script>
