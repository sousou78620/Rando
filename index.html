<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ ICI LA VRAIE CORRECTION -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #eef5f0;
      padding: 14px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      font-weight: 800;
      font-size: 26px;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid #d9e8dc;
      background: #f8fbf9;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #4caf50;
      color: white;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .section {
      margin-top: 12px;
      border-top: 1px solid #eef2ef;
      padding-top: 10px;
    }

    .section-title {
      font-weight: 800;
      color: #2e7d32;
    }

    .header {
      font-weight: 800;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="startDate" type="date">
    <input id="stepInput" placeholder="Étape">
    <input id="km" placeholder="Kilomètres">
    <input id="duration" placeholder="Durée">
  </div>

  <div class="section">
    <div class="section-title">🚗 Déplacement</div>
    <input id="transport" placeholder="Transport">
    <input id="transportPrice" placeholder="Prix transport">
  </div>

  <div class="section">
    <div class="section-title">🏨 Hébergement</div>
    <input id="hotelName" placeholder="Nom">
    <input id="hotelAddress" placeholder="Adresse">
    <input id="hotelPrice" placeholder="Prix">
  </div>

  <button onclick="addStep()">Ajouter une étape</button>

</div>

<div id="list"></div>

<script>
let steps = [];

function addStep() {
  const stepValue = document.getElementById("stepInput").value;

  if (!stepValue) {
    alert("Ajoute une étape 😉");
    return;
  }

  steps.push({
    step: stepValue
  });

  render();
  document.getElementById("stepInput").value = "";
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  steps.forEach(s => {
    list.innerHTML += `
      <div class="card">
        <div class="header">${s.step}</div>
      </div>
    `;
  });
}
</script>

</body>
</html>
