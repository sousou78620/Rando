<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 16px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
    }

    input, textarea {
      width: 100%;
      margin-bottom: 6px;
      padding: 8px;
    }

    button {
      width: 100%;
      margin-top: 5px;
      padding: 8px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 8px;
    }

    small {
      font-weight: bold;
      display: block;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>☀️ Mon itinéraire</h1>

<div class="card">
  <input id="startDate" type="date">
  <input id="step" placeholder="Étape">
  <input id="km" placeholder="Kilomètres">

  <input id="transport" placeholder="Transport">
  <input id="transportPrice" placeholder="Prix transport">

  <input id="hotel" placeholder="Hôtel">
  <input id="hotelPrice" placeholder="Prix hôtel">

  <input id="duration" placeholder="Durée">
  <textarea id="things" placeholder="Choses à voir"></textarea>
  <textarea id="comments" placeholder="Commentaires"></textarea>

  <button onclick="addStep()">Ajouter</button>
</div>

<div id="list"></div>

<script>
let steps = JSON.parse(localStorage.getItem("steps") || "[]");
let editingIndex = null;

function save() {
  localStorage.setItem("steps", JSON.stringify(steps));
}

function addStep() {
  const step = {
    startDate: document.getElementById("startDate").value,
    step: document.getElementById("step").value,
    km: parseFloat(document.getElementById("km").value) || 0,
    transport: document.getElementById("transport").value,
    transportPrice: parseFloat(document.getElementById("transportPrice").value) || 0,
    hotel: document.getElementById("hotel").value,
    hotelPrice: parseFloat(document.getElementById("hotelPrice").value) || 0,
    duration: document.getElementById("duration").value,
    things: document.getElementById("things").value,
    comments: document.getElementById("comments").value
  };

  if (!step.step) return;

  steps.push(step);
  save();
  render();

  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
}

function deleteStep(i) {
  steps.splice(i, 1);
  save();
  render();
}

function editStep(i) {
  editingIndex = i;
  render();
}

function saveEdit(i) {
  const container = document.getElementById("edit-" + i);

  steps[i] = {
    startDate: container.querySelector("input[type=date]").value,
    step: container.querySelectorAll("input")[1].value,
    km: parseFloat(container.querySelectorAll("input")[2].value) || 0,
    transport: container.querySelectorAll("input")[3].value,
    transportPrice: parseFloat(container.querySelectorAll("input")[4].value) || 0,
    hotel: container.querySelectorAll("input")[5].value,
    hotelPrice: parseFloat(container.querySelectorAll("input")[6].value) || 0,
    duration: container.querySelectorAll("input")[7].value,
    things: container.querySelectorAll("textarea")[0].value,
    comments: container.querySelectorAll("textarea")[1].value
  };

  editingIndex = null;
  save();
  render();
}

function formatDateFR(d) {
  if (!d) return "";
  return new Date(d).toLocaleDateString("fr-FR");
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  steps.forEach((s, i) => {

    if (editingIndex === i) {
      list.innerHTML += `
        <div class="card" id="edit-${i}">
          
          <small>Date</small>
          <input type="date" value="${s.startDate}">

          <small>Étape</small>
          <input value="${s.step}">

          <small>Kilomètres</small>
          <input value="${s.km}">

          <small>Transport</small>
          <input value="${s.transport}">

          <small>Prix transport (€)</small>
          <input value="${s.transportPrice}">

          <small>Hôtel</small>
          <input value="${s.hotel}">

          <small>Prix hôtel (€)</small>
          <input value="${s.hotelPrice}">

          <small>Durée</small>
          <input value="${s.duration}">

          <small>Choses à voir</small>
          <textarea>${s.things}</textarea>

          <small>Commentaires</small>
          <textarea>${s.comments}</textarea>

          <button onclick="saveEdit(${i})">💾 Sauvegarder</button>
        </div>
      `;
    } else {
      list.innerHTML += `
        <div class="card">
          <b>${formatDateFR(s.startDate)}</b><br>
          📍 ${s.step}<br>
          🚗 ${s.km} km<br>
          🚆 ${s.transport} (${s.transportPrice} €)<br>
          🏨 ${s.hotel} (${s.hotelPrice} €)<br>
          ⏱️ ${s.duration}<br>
          👀 ${s.things}<br>

          <button onclick="editStep(${i})">✏️ Modifier</button>
          <button onclick="deleteStep(${i})">🗑️ Supprimer</button>
        </div>
      `;
    }

  });
}

render();
</script>

</body>
</html>
