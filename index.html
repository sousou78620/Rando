<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #0070f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>☀️ Mon itinéraire</h1>

<div class="card">
  <input id="date" placeholder="Date">
  <input id="location" placeholder="Lieu / étape">
  <input id="hotel" placeholder="Hôtel">
  <textarea id="notes" placeholder="Notes"></textarea>
  <button onclick="addStep()">Ajouter</button>
</div>

<div id="list"></div>

<script>
  let steps = JSON.parse(localStorage.getItem("steps") || "[]");

  function save() {
    localStorage.setItem("steps", JSON.stringify(steps));
  }

  function addStep() {
    const step = {
      date: document.getElementById("date").value,
      location: document.getElementById("location").value,
      hotel: document.getElementById("hotel").value,
      notes: document.getElementById("notes").value
    };

    if (!step.location) return;

    steps.push(step);
    save();
    render();

    document.getElementById("date").value = "";
    document.getElementById("location").value = "";
    document.getElementById("hotel").value = "";
    document.getElementById("notes").value = "";
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    steps.forEach(s => {
      list.innerHTML += `
        <div class="card">
          <b>${s.date}</b><br>
          📍 ${s.location}<br>
          🏨 ${s.hotel}<br>
          <small>${s.notes}</small>
        </div>
      `;
    });
  }

  render();
</script>

</body>
</html>
