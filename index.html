<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Itinéraire Vacances</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef5f0;
  padding: 14px;
  margin: 0;
}

h1 { text-align:center; color:#2e7d32; }

.card {
  background:white;
  border-radius:10px;
  padding:10px;
  margin:10px 0;
}

input, textarea {
  width:100%;
  margin-bottom:6px;
}

button {
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#4caf50;
  color:white;
  border:none;
  border-radius:8px;
}

.btn-secondary { background:#78909c; }
.btn-danger { background:#ef5350; }

.actions {
  display:flex;
  gap:5px;
}
</style>
</head>

<body>

<h1>Mon itinéraire</h1>

<div class="card">
<input id="startDate" type="date">
<input id="stepInput" placeholder="Étape">
<input id="km" placeholder="km">
<input id="duration" placeholder="durée">

<button id="mainBtn" onclick="addOrSave()">Ajouter une étape</button>
</div>

<div id="list"></div>

<script>
let steps = [];
let editingIndex = null;

/* ✅ bouton intelligent */
function addOrSave() {
  if (editingIndex === null) {
    addStep();
  } else {
    saveEdit();
  }
}

/* ✅ ajout normal */
function addStep() {
  const step = document.getElementById("stepInput").value;

  if (!step) return;

  steps.push({
    step: step,
    km: document.getElementById("km").value
  });

  clearForm();
  render();
}

/* ✅ MODE EDIT */
function editStep(i) {
  const s = steps[i];

  document.getElementById("stepInput").value = s.step;
  document.getElementById("km").value = s.km;

  editingIndex = i;

  document.getElementById("mainBtn").innerText = "💾 Sauvegarder";
}

/* ✅ SAUVEGARDE */
function saveEdit() {
  steps[editingIndex] = {
    step: document.getElementById("stepInput").value,
    km: document.getElementById("km").value
  };

  editingIndex = null;

  document.getElementById("mainBtn").innerText = "Ajouter une étape";

  clearForm();
  render();
}

/* ✅ DELETE */
function deleteStep(i) {
  steps.splice(i,1);
  render();
}

function clearForm() {
  document.getElementById("stepInput").value = "";
  document.getElementById("km").value = "";
}

/* ✅ RENDER */
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  steps.forEach((s,i)=> {
    list.innerHTML += `
      <div class="card">
        <b>${s.step}</b> (${s.km})

        <div class="actions">
          <button class="btn-secondary" onclick="editStep(${i})">Modifier</button>
          <button class="btn-danger" onclick="deleteStep(${i})">Supprimer</button>
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
