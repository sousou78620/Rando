<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: flex;
      gap: 16px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #0070f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .small {
      font-size: 12px;
      color: gray;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<h1>☀️ Mon itinéraire</h1>

<div class="container">

  <!-- GAUCHE -->
  <div class="left">

    <div class="card">

      <input id="startDate" type="date">
      <input id="endDate" type="date">
      <input id="step" placeholder="Étape">
      <input id="km" placeholder="Kilomètres">

      <input id="transport" placeholder="Transport (train, voiture...)">
      <input id="transportPrice" placeholder="Prix transport (€)">

      <input id="hotel" placeholder="Hôtel">
      <input id="hotelPrice" placeholder="Prix hôtel (€)">

      <input id="duration" placeholder="Durée">
      <textarea id="things" placeholder="Choses à voir"></textarea>
      <textarea id="comments" placeholder="Commentaires"></textarea>

      <button onclick="addStep()">Ajouter une étape</button>
    </div>

    <div id="list"></div>

  </div>

  <!-- DROITE (TOTAUX) -->
  <div class="right">
    <div class="card">
      <h3>📊 Totaux</h3>
      <p>🚗 Total km : <b id="totalKm">0</b></p>
