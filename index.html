<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ CORRECT -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #eef5f0;
      padding: 14px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      font-weight: 800;
      font-size: 26px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid #d9e8dc;
      background: #f8fbf9;
      font-family: 'Nunito', sans-serif;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #4caf50;
      color: white;
      font-weight: 700;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .section {
      margin-top: 12px;
      border-top: 1px solid #eef2ef;
      padding-top: 10px;
    }

    .section-title {
      font-weight: 800;
      color: #2e7d32;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .header {
      font-weight: 800;
      font-size: 18px;
      color: #1b5e20;
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-secondary { background: #78909c; }
    .btn-danger { background: #ef5350; }

    .totals {
      position: sticky;
      top: 10px;
    }
  </style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="startDate" type="date">
