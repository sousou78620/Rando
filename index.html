<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Itinéraire</title>

<style>
body {
  font-family: Arial;
  background: #f3f3f3;
  padding: 20px;
}

.card {
  background: white;
  padding: 10px;
  margin: 10px 0;
}
</style>

</head>
<body>

<h2>Mon itinéraire</h2>

<div class="card">
  <div>Étape</div>
  <input id="step">
  <input id="km" placeholder="km">
  <input id="price" placeholder="prix">

  <button onclick="addStep()">Ajouter une étape</button>
</div>

<div id="list"></div>

<script>
let steps = [];

function addStep() {
  const step = document.getElementById("step").value;
  const km = document.getElementById("km").value;
  const price = document.getElementById("price").value;

  if (!step) {
    alert("Ajoute une étape");
    return;
  }

  steps.push({ step, km, price });

  render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];

    list.innerHTML += `
      <div class="card">
        ${s.step} - ${s.km} km - ${s.price}
      </div>
    `;
  }
}
</script>

</body>
</html>
