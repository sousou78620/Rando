<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #eef5f0;
      padding: 14px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      font-weight: 800;
      font-size: 26px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid #d9e8dc;
      background: #f8fbf9;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: #4caf50;
      color: white;
      font-weight: 700;
      margin-top: 8px;
    }

    .section {
      margin-top: 12px;
      border-top: 1px solid #eef2ef;
      padding-top: 10px;
    }

    .section-title {
      font-weight: 800;
      color: #2e7d32;
      margin-bottom: 6px;
    }

    .header {
      font-weight: 800;
      font-size: 18px;
      color: #1b5e20;
    }

    .line {
      margin: 3px 0;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-secondary { background: #78909c; }
    .btn-danger { background: #ef5350; }

    .totals {
      position: sticky;
      top: 10px;
    }
  </style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="startDate" type="date">
    <input id="step" placeholder="Étape">
    <input id="km" placeholder="Kilomètres">
    <input id="duration" placeholder="Durée">
  </div>

  <div class="section">
    <div class="section-title">🚗 Déplacement</div>
    <input id="transport" placeholder="Transport">
    <input id="transportPrice" placeholder="Prix transport (€)">
  </div>

  <div class="section">
    <div class="section-title">🏨 Hébergement</div>
    <input id="hotelName" placeholder="Nom de l’hébergement">
    <input id="hotelAddress" placeholder="Adresse">
    <input id="hotelPrice" placeholder="Prix (€)">
  </div>

  <div class="section">
    <div class="section-title">📋 Infos</div>
    <textarea id="things" placeholder="Choses à voir"></textarea>
    <textarea id="comments" placeholder="Commentaires"></textarea>
  </div>

  <button onclick="addStep()">Ajouter une étape</button>
</div>

<div class="card totals">
  <h3>📊 Totaux</h3>
  <div>🚗 Km total : <b id="totalKm">0</b></div>
  <div>💰 Budget total : <b id="totalPrice">0</b> €</div>
</div>

<div id="list"></div>

<script>
let steps = JSON.parse(localStorage.getItem("steps") || "[]");
let editingIndex = null;

function save() {
  localStorage.setItem("steps", JSON.stringify(steps));
}

function addStep() {
  const step = {
    startDate: startDate.value,
    step: step.value,
    km: parseFloat(km.value) || 0,
    duration: duration.value,
    transport: transport.value,
    transportPrice: parseFloat(transportPrice.value) || 0,
    hotelName: hotelName.value,
    hotelAddress: hotelAddress.value,
    hotelPrice: parseFloat(hotelPrice.value) || 0,
    things: things.value,
    comments: comments.value
  };

  if (!step.step) return;

  steps.push(step);
  save();
  render();

  document.querySelectorAll("input, textarea").forEach(e => e.value = "");
}
