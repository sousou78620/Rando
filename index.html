<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef5f0;
      padding: 16px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #4caf50;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .section {
      margin-top: 10px;
    }

    .section-title {
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 4px;
    }

    .line {
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<h1>🌿 Mon itinéraire</h1>

<div class="card">

  <div class="section">
    <div class="section-title">📍 Étape</div>
    <input id="date" type="date">
    <input id="step" placeholder="Étape">
    <input id="km" placeholder="Kilomètres">
    <input id="duration" placeholder="Durée">
  </div>

  <div class="section">
    <div class="section-title">🚗 Déplacement</div>
    <input id="transport" placeholder="Transport">
    <input id="transportPrice" placeholder="Prix transport">
  </div>

  <div class="section">
    <div class="section-title">🏨 Hébergement</div>
    <input id="hotel" placeholder="Nom hébergement">
    <input id="hotelAddress" placeholder="Adresse">
    <input id="hotelPrice" placeholder="Prix">
  </div>

  <div class="section">
    <div class="section-title">📋 Infos</div>
    <textarea id="things" placeholder="À voir"></textarea>
    <textarea id="comments" placeholder="Commentaires"></textarea>
  </div>

  <button onclick="addStep()">Ajouter une étape</button>

</div>

<div id="list"></div>

<script>
let steps = [];

function addStep() {
  try {

    const newStep = {
      date: document.getElementById("date").value,
      step: document.getElementById("step").value,
      km: document.getElementById("km").value,
      duration: document.getElementById("duration").value,
      transport: document.getElementById("transport").value,
      transportPrice: document.getElementById("transportPrice").value,
      hotel: document.getElementById("hotel").value,
      hotelAddress: document.getElementById("hotelAddress").value,
      hotelPrice: document.getElementById("hotelPrice").value,
      things: document.getElementById("things").value,
      comments: document.getElementById("comments").value
    };

    if (!newStep.step) {
      alert("Ajoute une étape 😊");
      return;
    }

    steps.push(newStep);

    render();

    // Reset des champs
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");

  } catch (error) {
    alert("Erreur JS → regarde la console");
    console.error(error);
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  steps.forEach(s => {

    list.innerHTML += `
      <div class="card">

        <div><strong>${s.date} — ${s.step}</strong></div>

        <div class="section">
          <div class="section-title">📍 Étape</div>
          <div class="line">Kilomètres : ${s.km}</div>
          <div class="line">Durée : ${s.duration}</div>
        </div>

        <div class="section">
          <div class="section-title">🚗 Déplacement</div>
          <div class="line">Transport : ${s.transport}</div>
          <div class="line">Prix : ${s.transportPrice}</div>
        </div>

        <div class="section">
          <div class="section-title">🏨 Hébergement</div>
          <div class="line">Nom : ${s.hotel}</div>
          <div class="line">Adresse : ${s.hotelAddress}</div>
          <div class="line">Prix : ${s.hotelPrice}</div>
        </div>

        <div class="section">
          <div class="section-title">📋 Infos</div>
          <div class="line">À voir : ${s.things}</div>
          <div class="line">Commentaires : ${s.comments}</div>
        </div>

      </div>
    `;
  });
}
</script>

</body>
</html>
