<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Itinéraire Vacances</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: flex;
      gap: 16px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #0070f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .small {
      font-size: 12px;
      color: gray;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<h1>☀️ Mon itinéraire</h1>

<div class="container">

  <!-- GAUCHE -->
  <div class="left">

    <div class="card">

      <input id="startDate" type="date">
      <input id="step" placeholder="Étape">
      <input id="km" placeholder="Kilomètres">

      <input id="transport" placeholder="Transport">
      <input id="transportPrice" placeholder="Prix transport (€)">

      <input id="hotel" placeholder="Hôtel">
      <input id="hotelPrice" placeholder="Prix hôtel (€)">

      <input id="duration" placeholder="Durée">
      <textarea id="things" placeholder="Choses à voir"></textarea>
      <textarea id="comments" placeholder="Commentaires"></textarea>

      <button onclick="addStep()">Ajouter une étape</button>
    </div>

    <div id="list"></div>

  </div>

  <!-- DROITE -->
  <div class="right">
    <div class="card">
      <h3>📊 Totaux</h3>
      <p>🚗 Total km : <b id="totalKm">0</b></p>
      <p>💰 Total budget : <b id="totalPrice">0</b> €</p>
    </div>
  </div>

</div>

<script>
  let steps = JSON.parse(localStorage.getItem("steps") || "[]");

  function save() {
    localStorage.setItem("steps", JSON.stringify(steps));
  }

  function addStep() {
    const step = {
      startDate: document.getElementById("startDate").value,
      step: document.getElementById("step").value,
      km: parseFloat(document.getElementById("km").value) || 0,
      transport: document.getElementById("transport").value,
      transportPrice: parseFloat(document.getElementById("transportPrice").value) || 0,
      hotel: document.getElementById("hotel").value,
      hotelPrice: parseFloat(document.getElementById("hotelPrice").value) || 0,
      duration: document.getElementById("duration").value,
      things: document.getElementById("things").value,
      comments: document.getElementById("comments").value
    };

    if (!step.step) return;

    steps.push(step);
    save();
    render();

    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
  }

  function deleteStep(index) {
    steps.splice(index, 1);
    save();
    render();
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    let totalKm = 0;
    let totalPrice = 0;

    steps.forEach((s, i) => {
      totalKm += s.km;
      totalPrice += s.transportPrice + s.hotelPrice;

      list.innerHTML += `
        <div class="card">
          <b>${s.startDate}</b><br>
          📍 ${s.step}<br>
          🚗 ${s.km} km<br>
          🚆 ${s.transport} (${s.transportPrice} €)<br>
          🏨 ${s.hotel} (${s.hotelPrice} €)<br>
          ⏱️ ${s.duration}<br>
          👀 ${s.things}<br>
          <div class="small">${s.comments}</div>
          <br>
          <button onclick="deleteStep(${i})">🗑️ Supprimer</button>
        </div>
      `;
    });

    document.getElementById("totalKm").innerText = totalKm;
    document.getElementById("totalPrice").innerText = totalPrice;
  }

  render();
</script>

</body>
</html>
